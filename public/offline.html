<!doctype html>
<html lang="en" class="scroll-pt-20">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline — iPrep Pro</title>
		<style>
			:root {
				--surface: #ffffff;
				--surface-raised: #fafafa;
				--line: #e4e4e7;
				--ink: #18181b;
				--ink-secondary: #52525b;
				--ink-muted: #a1a1aa;
				color-scheme: light;
			}
			.dark {
				--surface: #101012;
				--surface-raised: #18181b;
				--line: #27272a;
				--ink: #f4f4f5;
				--ink-secondary: #a1a1aa;
				--ink-muted: #71717a;
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			html {
				scroll-behavior: smooth;
			}
			body {
				background-color: var(--surface);
				color: var(--ink);
				font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
				-webkit-font-smoothing: antialiased;
				text-rendering: optimizeLegibility;
				margin: 0;
			}
			.page {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100dvh;
			}
			.wrap {
				max-width: 28rem;
				margin: 0 auto;
				padding: 0 1.5rem;
				text-align: center;
			}
			.icon-box {
				display: grid;
				place-items: center;
				width: 4rem;
				height: 4rem;
				border-radius: 1rem;
				background: linear-gradient(135deg, #6366f1, #8b5cf6);
				margin: 0 auto 1.5rem;
				color: #ffffff;
			}
			h1 {
				margin: 0;
				font-size: 1.5rem;
				font-weight: 600;
				letter-spacing: -0.025em;
			}
			p {
				margin: 0.75rem 0 0;
				font-size: 0.875rem;
				line-height: 1.625;
				color: var(--ink-secondary);
			}
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				margin-top: 1.5rem;
				border-radius: 0.75rem;
				background: #4f46e5;
				color: #ffffff;
				padding: 0.625rem 1.25rem;
				font-size: 0.875rem;
				font-weight: 500;
				text-decoration: none;
				transition: background-color 0.15s ease;
			}
			.btn:hover {
				background: #6366f1;
			}
			.btn:focus-visible {
				outline: 2px solid #6366f1;
				outline-offset: 2px;
			}
		</style>
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('iprep.theme');
					const dark = stored
						? stored === 'dark'
						: matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.classList.toggle('dark', dark);
				} catch {}
			})();
		</script>
	</head>
	<body class="page">
		<div class="wrap">
			<div class="icon-box">
				<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
				</svg>
			</div>
			<h1>You're offline</h1>
			<p>
				iPrep Pro is designed to work offline. The page you're looking for isn't cached yet,
				but you can still browse previously visited content.
			</p>
			<a class="btn" href="/">Go to home</a>
		</div>
	</body>
</html>
